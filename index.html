<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Images/ElysiumIcon.png">
    <link rel="stylesheet" href="styles/site.css">
    <link rel="stylesheet" href="styles/search.css?v=13">
    <title>Fable</title>
    <style>
      :root {
        --black: #030704;
        --panel: #071108;
        --green: #39ff88;
        --green-soft: #94ffc1;
        --green-dim: #1a8f4c;
        --line: rgba(57, 255, 136, 0.28);
      }

      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-width: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .crt-scrollbar {
        background: #020503;
        border-left: 1px solid var(--line);
        bottom: 0;
        pointer-events: auto;
        position: fixed;
        right: 0;
        top: 0;
        width: 14px;
        z-index: 20;
      }

      .crt-scrollbar-button {
        cursor: pointer;
        color: var(--green-soft);
        font-family: Arial, sans-serif;
        font-size: 12px;
        height: 16px;
        left: 0;
        line-height: 16px;
        position: absolute;
        text-align: center;
        width: 100%;
      }

      .crt-scrollbar-button.up {
        top: 0;
      }

      .crt-scrollbar-button.down {
        bottom: 0;
      }

      .crt-scrollbar-thumb {
        cursor: grab;
        background: #145f35;
        border-radius: 0;
        left: 2px;
        min-height: 42px;
        position: absolute;
        right: 2px;
        top: 0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at center, rgba(26, 143, 76, 0.16), transparent 58%),
          var(--black);
        color: var(--green-soft);
        font-family: "Courier New", monospace;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        background:
          linear-gradient(rgba(57, 255, 136, 0.07) 50%, rgba(0, 0, 0, 0.2) 50%),
          radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.42) 100%);
        background-size: 100% 4px, 100% 100%;
        mix-blend-mode: screen;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 11;
        box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.9);
      }

      .screen {
        min-height: 100vh;
        margin: 0 auto;
        max-width: 1180px;
        padding: clamp(18px, 4vw, 44px);
        text-align: left;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        text-shadow: 0 0 10px rgba(57, 255, 136, 0.74);
      }

      .brand h1 {
        color: var(--green);
        font-size: clamp(2.5rem, 6vw, 3.8rem);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
        text-transform: uppercase;
      }

      .brand p,
      .status {
        color: var(--green-soft);
        font-size: 0.95rem;
        letter-spacing: 0;
        margin: 10px 0 0;
        text-decoration: none;
        text-transform: uppercase;
      }

      main {
        padding-top: clamp(22px, 5vw, 52px);
      }

      .hero {
        border-bottom: 1px solid var(--line);
        margin: 0 0 28px;
        max-width: none;
        padding-bottom: 28px;
      }

      .prompt {
        color: var(--green);
        font-size: clamp(1.75rem, 4.8vw, 3.8rem);
        font-weight: 400;
        line-height: 1.05;
        margin: 0;
        text-shadow:
          0 0 8px rgba(57, 255, 136, 0.8),
          0 0 26px rgba(57, 255, 136, 0.35);
        text-transform: uppercase;
      }

      .category-index {
        color: var(--green-dim);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }


      .categories {
        background: rgba(3, 7, 4, 0.54);
        border: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 10px;
      }

      .category {
        align-items: center;
        background: rgba(7, 17, 8, 0.78);
        border: 1px solid var(--line);
        border-radius: 0;
        color: var(--green);
        display: grid;
        gap: 16px;
        grid-template-columns: 44px minmax(0, 1fr) 16px;
        min-height: 106px;
        padding: 18px;
        position: relative;
        text-decoration: none;
        text-shadow: 0 0 12px rgba(57, 255, 136, 0.65);
        text-transform: uppercase;
      }

      .category::after {
        color: var(--green-dim);
        content: ">";
        font-size: 1.1rem;
        position: absolute;
        right: 18px;
      }

      .category-index {
        border-right: 1px solid var(--line);
        color: var(--green-dim);
        padding-right: 12px;
      }

      .category-title {
        color: var(--green);
        font-size: clamp(1.35rem, 2.3vw, 2rem);
        letter-spacing: 0.04em;
        line-height: 1.1;
        white-space: nowrap;
      }

      .category:hover,
      .category:focus-visible {
        background: rgba(26, 143, 76, 0.16);
        border-color: var(--green);
        outline: none;
      }

      .home-page-nav a:not(.home-link) {
        pointer-events: auto;
        visibility: visible;
      }

      @media (max-width: 760px) {
        .categories {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .category {
          min-height: 94px;
        }
      }

      @media (max-width: 480px) {
        .categories {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header>
        <nav class="topbar home-page-nav" aria-label="Site header">
          <a class="home-link" href="index.html">Fable</a>
          <a href="classes/classes.html">Classes</a>
          <a href="races/index.html">Races</a>
          <a href="backgrounds/index.html">Backgrounds</a>
          <a href="items/index.html">Items</a>
          <span class="menu-break" aria-hidden="true"></span>
          <a href="#">Perks</a>
          <a href="systems/index.html">Systems</a>
          <a href="lore/index.html">Lore</a>
          <a href="records/index.html">Records</a>
        </nav>
      </header>

      <main id="home">
        <section class="hero" aria-labelledby="page-title">
          <h1 class="prompt" id="page-title">Public City Archive</h1>
        </section>

        <section class="categories" id="categories" aria-label="Categories">
          <a class="category" href="classes/classes.html"><span class="category-index">01</span><span class="category-title">Classes</span></a>
          <a class="category" href="races/index.html"><span class="category-index">02</span><span class="category-title">Races</span></a>
          <a class="category" href="backgrounds/index.html"><span class="category-index">03</span><span class="category-title">Backgrounds</span></a>
          <a class="category" href="items/index.html"><span class="category-index">04</span><span class="category-title">Items</span></a>
          <a class="category" href="#"><span class="category-index">05</span><span class="category-title">Perks</span></a>
          <a class="category" href="systems/index.html"><span class="category-index">06</span><span class="category-title">Systems</span></a>
          <a class="category" href="lore/index.html"><span class="category-index">07</span><span class="category-title">Lore</span></a>
              <a class="category" href="records/index.html"><span class="category-index">08</span><span class="category-title">Records</span></a>
        </section>
      </main>

    </div>
    <script src="scripts/search.js?v=8"></script>
    <script src="scripts/spell-manifest.js?v=1"></script>
    <script src="scripts/spell-links.js?v=8" data-spell-index="systems/spellcasting.html"></script>
    <script>
      (() => {
        const track = document.createElement("div");
        const up = document.createElement("div");
        const thumb = document.createElement("div");
        const down = document.createElement("div");

        track.className = "crt-scrollbar";
        up.className = "crt-scrollbar-button up";
        thumb.className = "crt-scrollbar-thumb";
        down.className = "crt-scrollbar-button down";
        up.textContent = "^";
        down.textContent = "v";
        track.appendChild(up);
        track.appendChild(thumb);
        track.appendChild(down);
        document.body.appendChild(track);

        const scrollByAmount = (amount) => {
          window.scrollBy({ top: amount, behavior: "smooth" });
        };

        const updateScrollbar = () => {
          const doc = document.documentElement;
          const maxScroll = doc.scrollHeight - window.innerHeight;

          if (maxScroll <= 0) {
            track.style.display = "none";
            return;
          }

          track.style.display = "block";
          const buttonSpace = 16;
          const trackHeight = window.innerHeight - (buttonSpace * 2);
          const thumbHeight = Math.max(42, trackHeight * (window.innerHeight / doc.scrollHeight));
          const thumbTop = buttonSpace + (doc.scrollTop / maxScroll) * (trackHeight - thumbHeight);

          thumb.style.height = `${thumbHeight}px`;
          thumb.style.transform = `translateY(${thumbTop}px)`;
        };

        const scrollToPointer = (event) => {
          if (event.target === up || event.target === down || event.target === thumb) {
            return;
          }

          const rect = track.getBoundingClientRect();
          const buttonSpace = 16;
          const trackHeight = window.innerHeight - (buttonSpace * 2);
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          const position = Math.min(Math.max(event.clientY - rect.top - buttonSpace, 0), trackHeight);
          window.scrollTo({ top: (position / trackHeight) * maxScroll, behavior: "smooth" });
        };

        const startDrag = (event) => {
          event.preventDefault();
          const doc = document.documentElement;
          const maxScroll = doc.scrollHeight - window.innerHeight;
          const buttonSpace = 16;
          const trackHeight = window.innerHeight - (buttonSpace * 2);
          const thumbHeight = thumb.offsetHeight;
          const startY = event.clientY;
          const startScroll = doc.scrollTop;

          const onMove = (moveEvent) => {
            const delta = moveEvent.clientY - startY;
            const scrollDelta = delta * (maxScroll / (trackHeight - thumbHeight));
            window.scrollTo(0, startScroll + scrollDelta);
          };

          const onUp = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };

          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        };

        up.addEventListener("click", () => scrollByAmount(-window.innerHeight * 0.85));
        down.addEventListener("click", () => scrollByAmount(window.innerHeight * 0.85));
        track.addEventListener("click", scrollToPointer);
        thumb.addEventListener("pointerdown", startDrag);
        window.addEventListener("scroll", updateScrollbar, { passive: true });
        window.addEventListener("resize", updateScrollbar);
        updateScrollbar();
      })();
    </script>
  </body>
</html>
